name: Android 公测反馈
description: 报告词伴 Android 的功能问题、布局问题或兼容情况。
title: "[Android] "
body:
  - type: markdown
    attributes:
      value: "感谢试用词伴。此表公开可见，请不要填写密码、手机号或私人聊天内容；截图、录屏请遮住私人信息。"
  - type: input
    id: version
    attributes:
      label: 词伴版本
      placeholder: "例如 0.1.42"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和系统
      placeholder: "品牌、型号、Android 版本；手机还是平板"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 出现问题的应用
      placeholder: "应用名称及版本，例如微信；若仅在词伴试打框出现也请说明"
  - type: input
    id: layout
    attributes:
      label: 键盘设置
      placeholder: "九键/26键、横屏/竖屏、高度、底部留白、系统字体大小"
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: "请写明实际输入的字母或数字；若测试正常，可填写已测试的功能。"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期和实际结果
      description: "是否每次发生？重新打开键盘后是否恢复？可以附已遮挡私人信息的截图或录屏。"
    validations:
      required: true
