[package]
name = "wordtrail-mobile"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "wordtrail_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
qingjian-core = { path = "../vendor/qingjian/crates/qingjian-core" }
qingjian-dictionary = { path = "../vendor/qingjian/crates/qingjian-dictionary" }
qingjian-translate = { path = "../vendor/qingjian/crates/qingjian-translate" }
qingjian-learning = { path = "../vendor/qingjian/crates/qingjian-learning" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wordtrail-pronunciation = { path = "../pronunciation" }
wordtrail-vocabulary = { path = "../vocabulary" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
