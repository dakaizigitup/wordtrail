name: Wordtrail
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Wordtrail:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 词伴输入法
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wordtrail.keyboarddemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WordtrailKeyboard
  WordtrailKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - path: Keyboard
        excludes: [Data]
      - path: Keyboard/Data
        type: folder
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 词伴
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wordtrail.keyboarddemo.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lc", "-lm", "-liconv"]
    dependencies:
      - framework: Frameworks/WordtrailCore.xcframework
        embed: false
schemes:
  Wordtrail:
    build:
      targets:
        Wordtrail: all
