[package]
name = "wordtrail-windows-server"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-or-later"
[lib]
name = "qingjian_windows_server"
[[bin]]
name = "qingjian-server"
path = "src/main.rs"
[dependencies]
qingjian-core = { path = "../vendor/qingjian/crates/qingjian-core" }
qingjian-dictionary = { path = "../vendor/qingjian/crates/qingjian-dictionary" }
qingjian-learning = { path = "../vendor/qingjian/crates/qingjian-learning" }
qingjian-lm = { path = "../vendor/qingjian/crates/qingjian-lm" }
qingjian-neural = { path = "../vendor/qingjian/crates/qingjian-neural" }
qingjian-platform = { path = "../vendor/qingjian/crates/qingjian-platform" }
qingjian-predict = { path = "../vendor/qingjian/crates/qingjian-predict" }
qingjian-render = { path = "../vendor/qingjian/crates/qingjian-render" }
qingjian-translate = { path = "../vendor/qingjian/crates/qingjian-translate" }
qingjian-update = { path = "../vendor/qingjian/crates/qingjian-update" }
dotenvy = "0.15.7"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
toml_edit = "0.25"
wordtrail-pronunciation = { path = "../pronunciation" }
wordtrail-vocabulary = { path = "../vocabulary" }
[build-dependencies]
embed-manifest = "1.4.0"
[target."cfg(windows)".dependencies]
windows-registry = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
